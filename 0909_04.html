<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>순서정하기</title>
</head>
<body>
    <h1>ol로 순서 정한거</h1>
    <ul>
        <li> 과일
            <ol type="I">
                <li>사과</li>
                <li>오렌지</li>
                <li>키위</li>
            </ol>
        </li>
    </ul>
    <h1>ul로 순서 정한거</h1>
    <ul type="circle">
        <li>사과</li>
        <li>오렌지</li>
        <li>키위</li>
    </ul>
</body>
</html>
